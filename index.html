      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #05080f;

    .font-mono-code { font-family: 'JetBrains Mono', monospace; }
    .bg-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
    .neon-purple-grid {
      background-size: 96px 96px;
      background-image:
        linear-gradient(to right, rgba(168, 85, 247, 0.075) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(168, 85, 247, 0.075) 1px, transparent 1px);
      -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 35%, #000 20%, transparent 100%);
      mask-image: radial-gradient(ellipse 75% 65% at 50% 35%, #000 20%, transparent 100%);
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.7; }
      70% { transform: scale(1.18); opacity: 0; }
      100% { transform: scale(1.18); opacity: 0; }
    }
    .animate-ring {
      animation: pulse-ring 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }
